---
version: "3"

tasks:
  default:
    silent: true
    cmds:
      - task -l

  vet:
    desc: Run go vet
    cmds:
      - go vet

  build:
    desc: Build App
    cmds:
      - CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=dev" .

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run ./...

  vuln:
    desc: Check for vulnerabilities
    cmds:
      - govulncheck ./...

  upgrade-deps:
    desc: Upgrade all dependencies
    cmds:
      - go get -u ./...

  test:
    desc: Run tests
    summary: Run tests via testcontainers (requires Docker)
    deps:
      - build
    cmds:
      - go test -v
